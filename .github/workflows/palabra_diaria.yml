name: Palabra del día por correo
# Cada mañana (desde las 6:00, hora de Bogotá, con reintentos hasta la tarde porque GitHub a veces retrasa o salta ejecuciones) pide al servidor que envíe la Palabra del día a los suscriptores.
# El servidor manda como máximo un correo por persona al día, así que repetir la llamada es seguro.
on:
  schedule:
    - cron: '7,37 11-17 * * *'
  workflow_dispatch:
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir el envío
        run: |
          r=$(curl -sS --max-time 120 https://www.concursosdelestado.com/acceso/enviar_palabra_virgen.php || true)
          echo "$r"
